# NAS-11: use all three NVMe Composite sensors; highest demand wins.
version: 1
device:
  id: nas11_nuc9
control:
  mode: override
  decrease_delay: 10s
sources:
  cpu_package:
    kind: cpu
    provider: thermal_zone
    selector:
      type: x86_pkg_temp
    poll_interval: 100ms
    stale_after: 500ms
  nvme_02:
    kind: smart
    provider: hwmon
    selector:
      name: nvme
      channel: temp1
      label: Composite
      pci_address: '0000:02:00.0'
    poll_interval: 1s
    stale_after: 5s
  nvme_03:
    kind: smart
    provider: hwmon
    selector:
      name: nvme
      channel: temp1
      label: Composite
      pci_address: '0000:03:00.0'
    poll_interval: 1s
    stale_after: 5s
  nvme_04:
    kind: smart
    provider: hwmon
    selector:
      name: nvme
      channel: temp1
      label: Composite
      pci_address: '0000:04:00.0'
    poll_interval: 1s
    stale_after: 5s
fans:
  cpufan:
    minimum_running_duty_percent: 40
    override:
      mode: cool
      fixed:
        duty_percent: 40
      combine: max
      inputs:
      - source: cpu_package
        boost_above_c: 90
      fan_off:
        enabled: false
        temperature_c: 0
  sysfan:
    minimum_running_duty_percent: 30
    override:
      mode: custom
      fixed:
        duty_percent: 30
      combine: max
      inputs:
      - source: nvme_02
        custom:
          minimum_temperature_c: 48
          minimum_duty_percent: 30
          duty_increment_percent_per_c: 15
        boost_above_c: 53
      - source: nvme_03
        custom:
          minimum_temperature_c: 48
          minimum_duty_percent: 30
          duty_increment_percent_per_c: 15
        boost_above_c: 53
      - source: nvme_04
        custom:
          minimum_temperature_c: 48
          minimum_duty_percent: 30
          duty_increment_percent_per_c: 15
        boost_above_c: 53
      fan_off:
        enabled: false
        temperature_c: 0
mqtt:
  enabled: true
  broker: tcp://pi-1.timandes.net:1883
  client_id: nas11_nuc9
  username: null
  password_file: null
  topic_prefix: nuc9/nas11
  discovery:
    enabled: true
    prefix: homeassistant
runtime:
  shutdown_action: hold
  sensor_failure_action: max_then_exit
